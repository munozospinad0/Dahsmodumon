# Reloj del saludo automático de Modumon.
#
# Por qué acá y no en Vercel: la cuenta es plan Hobby, y ahí los cron jobs de Vercel
# corren UNA VEZ AL DÍA. Para saludar a un lead que acaba de entrar eso no sirve.
# GitHub Actions permite cada 5 minutos y es gratis en repos privados.
#
# Ojo con la puntualidad: GitHub encola los cron y en horas pico puede atrasarse varios
# minutos. Para un saludo de WhatsApp es irrelevante; para algo con hora exacta, no sirve.
name: Saludo automático

on:
  schedule:
    - cron: '*/10 * * * *'     # cada 10 minutos
  workflow_dispatch:            # y a mano desde la pestaña Actions

# Que dos corridas no se pisen y saluden dos veces al mismo lead.
concurrency:
  group: saludo-modumon
  cancel-in-progress: false

jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint
        run: |
          RESP=$(curl -s --max-time 120 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://dash-modumon.vercel.app/api/saludar")
          echo "$RESP"
          # Si no vino JSON con ok, el paso falla y GitHub avisa por correo.
          echo "$RESP" | grep -q '"ok":true' || {
            echo "::error::el endpoint no respondió ok"
            exit 1
          }
          ENV=$(echo "$RESP" | grep -o '"enviados":[0-9]*' | cut -d: -f2)
          echo "::notice::saludos enviados en esta corrida: ${ENV:-0}"
